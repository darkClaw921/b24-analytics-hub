services:
  python-executor:
    build:
      context: .
      dockerfile: python-executor/Dockerfile
    container_name: python-executor
    ports:
      - "8002:8002"
    volumes:
      - python_executor_cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  b24-analytics-hub-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: b24-analytics-hub-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - python-executor
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/backend/b24_analytics.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}

      - MCP_BITRIX24_URL=${MCP_BITRIX24_URL}
      - MCP_BITRIX24_NAME=${MCP_BITRIX24_NAME}
      - MCP_BITRIX24_TRANSPORT=${MCP_BITRIX24_TRANSPORT}
      - MCP_BITRIX24_AUTH_TOKEN=${MCP_BITRIX24_AUTH_TOKEN}

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - DEBUG=${DEBUG}
      
      - PYTHON_EXECUTOR_URL=http://python-executor:8002
      - PYTHON_EXECUTOR_TIMEOUT=${PYTHON_EXECUTOR_TIMEOUT:-30}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  b24-analytics-hub-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: b24-analytics-hub-frontend
    ports:
      - "3001:3000"
    depends_on:
      - b24-analytics-hub-backend
    environment:
      - VITE_BACKEND_URL=http://b24-analytics-hub-backend:8001
      - VITE_WS_URL=ws://b24-analytics-hub-backend:8001/ws
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  python_executor_cache:
