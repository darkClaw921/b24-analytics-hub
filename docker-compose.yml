services:
  b24-analytics-hub-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: b24-analytics-hub-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - backend_data:/app/data
    
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/b24_analytics.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  b24-analytics-hub-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: b24-analytics-hub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - b24-analytics-hub-backend
    environment:
      - VITE_BACKEND_URL=http://b24-analytics-hub-backend:8001
      - VITE_WS_URL=ws://b24-analytics-hub-backend:8001/ws
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:
